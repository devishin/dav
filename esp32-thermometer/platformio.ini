; ESP32-S3-DevKitC-1 module ESP32-S3-WROOM-1-N16R8 (16 MB flash, 8 MB OPI PSRAM)
; Default PlatformIO board id is N8/no PSRAM — overrides below match Espressif N16R8 module.

[platformio]
default_envs = release
src_dir = src
include_dir = include

[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
lib_deps =
	beegee-tokyo/DHT sensor library for ESPx@1.19
	bblanchon/ArduinoJson@6.21.5

[env:release]
extends = common
build_flags =
	${common.build_flags}
	-DAPP_FULL=1

[env:hw-test]
extends = common
build_flags =
	${common.build_flags}
	-DPHASE_HW_TEST=1
	-DDHT_READ_INTERVAL_MS=3000
